<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- 文档主体 -->
  <rect x="20" y="10" width="60" height="80" rx="6" ry="6" fill="none" stroke="#808080" stroke-width="3"/>
  <!-- 文档顶部横线 -->
  <line x1="35" y1="30" x2="75" y2="30" stroke="#808080" stroke-width="2.5" stroke-linecap="round"/>
  <!-- 文档中部横线 -->
  <line x1="35" y1="45" x2="70" y2="45" stroke="#808080" stroke-width="2.5" stroke-linecap="round"/>
  <!-- 文档底部横线 -->
  <line x1="35" y1="60" x2="65" y2="60" stroke="#808080" stroke-width="2.5" stroke-linecap="round"/>
  <!-- 放大镜手柄 -->
  <line x1="75" y1="75" x2="95" y2="95" stroke="#808080" stroke-width="5" stroke-linecap="round"/>
  <!-- 放大镜框 -->
  <circle cx="68" cy="68" r="15" fill="none" stroke="#808080" stroke-width="3"/>
</svg>
